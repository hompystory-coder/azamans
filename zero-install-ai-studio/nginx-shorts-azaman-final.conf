# shorts.neuralgrid.kr - Nginx Configuration
# 포트 80만 사용 (외부 접속용)
# 내부적으로 두 개의 독립적인 인스턴스로 프록시

# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name shorts.neuralgrid.kr;
    
    # Let's Encrypt를 위한 ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    
    return 301 https://$server_name$request_uri;
}

# HTTPS 서버 (포트 443)
server {
    listen 443 ssl http2;
    server_name shorts.neuralgrid.kr;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/shorts.neuralgrid.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shorts.neuralgrid.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 로그
    access_log /var/log/nginx/shorts.neuralgrid.kr.access.log;
    error_log /var/log/nginx/shorts.neuralgrid.kr.error.log;

    # 파일 업로드 크기 제한
    client_max_body_size 500M;

    # /azaman/ 경로 - 새로운 독립 인스턴스 (포트 3000)
    location /azaman/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 타임아웃 설정
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    
    # /azaman 경로도 처리 (trailing slash 없이)
    location = /azaman {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 타임아웃 설정
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
    
    # /azaman/_next (Azaman용 Next.js 정적 파일)
    location /azaman/_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # 캐싱 설정
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /videos/ - 비디오 파일 제공
    location /videos/ {
        alias /mnt/music-storage/generated-shorts/videos/;
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
        types {
            video/mp4 mp4;
        }
    }

    # 루트 경로 - 기존 인스턴스 (포트 3006) - 절대 변경 금지!
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 타임아웃 설정
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 헬스체크
    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
