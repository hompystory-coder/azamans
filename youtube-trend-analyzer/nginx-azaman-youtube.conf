# shorts.neuralgrid.kr - Nginx Configuration
# 포트 80/443만 사용
# /azaman/ → YouTube 트렌드 분석기

# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name shorts.neuralgrid.kr;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    
    return 301 https://$server_name$request_uri;
}

# HTTPS 서버
server {
    listen 443 ssl http2;
    server_name shorts.neuralgrid.kr;

    # SSL 인증서
    ssl_certificate /etc/letsencrypt/live/shorts.neuralgrid.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shorts.neuralgrid.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 로그
    access_log /var/log/nginx/shorts.neuralgrid.kr.access.log;
    error_log /var/log/nginx/shorts.neuralgrid.kr.error.log;

    # 파일 업로드 크기 제한
    client_max_body_size 500M;

    # /azaman/ - YouTube 트렌드 분석기 (프론트엔드 정적 파일)
    location /azaman/ {
        alias /home/azamans/webapp/youtube-trend-analyzer/frontend/dist/;
        try_files $uri $uri/ /azaman/index.html;
        
        # 정적 파일 캐싱
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # /azaman/api/ - YouTube 트렌드 분석기 (백엔드 API)
    location /azaman/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS 설정
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # /videos/ - 비디오 파일
    location /videos/ {
        alias /mnt/music-storage/generated-shorts/videos/;
        add_header Cache-Control "public, max-age=31536000";
        add_header Access-Control-Allow-Origin *;
        types {
            video/mp4 mp4;
        }
    }

    # 루트 경로 - 기존 서비스 (절대 변경 금지!)
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 타임아웃
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 헬스체크
    location /healthz {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
